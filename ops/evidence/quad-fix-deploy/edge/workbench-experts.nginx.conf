# Origin workbench.aivia.asia :443 — no port-in-redirect traps
# Both /experts and /experts/ serve the page (no 302 to :8443)

location = /experts {
    default_type text/html;
    alias /var/www/aivia-experts/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Aivia-Experts "1" always;
}

location ^~ /experts/ {
    alias /var/www/aivia-experts/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Aivia-Experts "1" always;
}
