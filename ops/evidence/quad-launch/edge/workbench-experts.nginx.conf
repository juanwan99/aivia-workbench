# Injected into workbench.aivia.asia :443 server (QUAD-LAUNCH)
location = /experts {
    return 302 /experts/;
}
location ^~ /experts/ {
    alias /home/ops/aivia-workbench/ops/evidence/quad-launch/experts/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Aivia-Experts "1" always;
}
