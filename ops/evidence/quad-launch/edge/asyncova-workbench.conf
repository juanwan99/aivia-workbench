# QUAD-LAUNCH public edge locations — include inside asyncova.com :8443 server
# Upstream defined in 00-aivia-workbench-upstream.conf (http context)

# Experts directory (static, served from ECS via tunnel /experts)
location ^~ /experts {
    proxy_pass http://aivia_workbench_tunnel;
    proxy_http_version 1.1;
    proxy_set_header Host workbench.aivia.asia;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    sub_filter_types text/html text/css application/javascript application/json;
    sub_filter 'https://workbench.aivia.asia' 'https://asyncova.com';
    sub_filter 'http://workbench.aivia.asia' 'https://asyncova.com';
    sub_filter_once off;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

location ^~ /chat/ {
    proxy_pass http://aivia_workbench_tunnel;
    proxy_http_version 1.1;
    proxy_set_header Host workbench.aivia.asia;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
